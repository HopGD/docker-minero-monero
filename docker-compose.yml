version: "3.8"

services:
  miner:
    build: .
    container_name: xmrig-miner
    restart: unless-stopped
    cpus: 10.5
    mem_limit: 4g
    volumes:
      - /mnt/hugepages:/mnt/hugepages
    command:
      - "-o"
      - "pool.supportxmr.com:3333"
      - "-u"
      - "TU_WALLET"
      - "-p"
      - "docker"
      - "--cpu-max-threads-hint=75"
      - "--randomx-1gb-pages"
